[project]
name = "study-presence"
version = "0.1.0"
description = "在座学习状态监测：摄像头 + 可插拔人脸检测（本地 YuNet / 百度云）+ Tkinter 桌面窗口"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.scripts]
study-presence = "app.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.basedpyright]
include = ["app", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
